# Accounts API for the study plan on shoobyd.github.io/tech-curriculum.
# Deployed separately from the site (which stays static on GitHub Pages):
#   npm run migrate:remote && npm run deploy
# Secrets are never stored here (npx wrangler secret put <NAME>):
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, SESSION_SECRET
# Locally they come from .dev.vars (see .dev.vars.example).

name = "tech-curriculum-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# origins allowed to call the API and to receive a login (the live site, plus local dev)
ALLOWED_ORIGINS = "https://shoobyd.github.io,http://localhost:4399"

[[d1_databases]]
binding = "DB"
database_name = "tech-lead-curriculum"
# created with `npx wrangler d1 create tech-lead-curriculum`; local dev keeps its own copy under .wrangler/
database_id = "df0eb692-0577-402d-8476-d594b51ca6fd"
migrations_dir = "migrations"

# The friends' live room (src/room.ts): holds the open pages' WebSockets and pushes changes.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Durable Object class history. The free plan supports only SQLite-backed classes, so the class
# is declared with new_sqlite_classes even though the room stores nothing.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

